<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii System Menu</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        :root {
            --wii-blue: #3ab4f2;
            --wii-blue-glow: rgba(58, 180, 242, 0.55);
            --wii-gray: #8a9199;
            --wii-edge: #d6dce2;
        }

        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(ellipse at 50% 0%, #ffffff 0%, rgba(255, 255, 255, 0) 60%),
                linear-gradient(to bottom, #f4f8fb 0%, #e3eaf0 100%);
            font-family: "Nimbus Sans", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header: quiet, like the Wii's channel-page header */
        .top-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .system-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--wii-gray);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .controller-status {
            font-size: 12px;
            color: #aab2ba;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--wii-edge);
        }

        .controller-status.connected {
            color: var(--wii-blue);
            border-color: var(--wii-blue);
        }

        /* 4x3 Channel Grid Area */
        .grid-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 6px 80px 18px;
            min-height: 0;
        }

        .page-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            background: linear-gradient(to bottom, #ffffff 0%, #e8edf1 100%);
            border: 2px solid var(--wii-edge);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--wii-blue);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), inset 0 -3px 6px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.15s ease;
            z-index: 10;
        }

        .page-arrow:hover {
            border-color: var(--wii-blue);
            box-shadow: 0 0 14px var(--wii-blue-glow), 0 3px 8px rgba(0, 0, 0, 0.12);
            transform: translateY(-50%) scale(1.1);
        }

        .page-arrow.left { left: 16px; }
        .page-arrow.right { right: 16px; }

        .wii-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 18px;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            max-height: 600px;
        }

        /* Channel tile: white glossy slab with a soft gray rim */
        .wii-channel {
            background: linear-gradient(to bottom, #ffffff 0%, #f3f6f8 55%, #e4e9ed 100%);
            border: 2px solid var(--wii-edge);
            border-radius: 16px;
            box-shadow: 0 3px 8px rgba(80, 100, 120, 0.15),
                        inset 0 -4px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            overflow: hidden;
        }

        /* Gloss highlight across the top half */
        .wii-channel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.25) 100%);
            border-radius: 14px 14px 60% 60% / 14px 14px 30% 30%;
            pointer-events: none;
        }

        /* Pointer-over / selected: blue outline with glow */
        .wii-channel:hover, .wii-channel.selected {
            transform: scale(1.05);
            border-color: var(--wii-blue);
            box-shadow: 0 0 0 3px rgba(58, 180, 242, 0.35),
                        0 0 22px var(--wii-blue-glow),
                        0 8px 18px rgba(0, 0, 0, 0.18);
            z-index: 5;
        }

        .channel-badge {
            align-self: flex-start;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 10px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            position: relative;
        }

        .badge-wii { background: linear-gradient(to bottom, #5cc6fa, #2c9fe0); }
        .badge-gamecube { background: linear-gradient(to bottom, #8a63c9, #5b3a9c); }
        .badge-switch { background: linear-gradient(to bottom, #f0525c, #d0222e); }
        .badge-empty { background: transparent; }

        .channel-title {
            font-size: 15px;
            font-weight: 600;
            color: #4a5258;
            text-align: center;
            margin: auto 0;
            line-height: 1.25;
            word-break: break-word;
            position: relative;
        }

        .channel-empty {
            cursor: default;
            background: linear-gradient(to bottom, #f6f9fb 0%, #e9eef2 100%);
            border: 2px solid #e3e8ec;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.07);
        }

        .channel-empty::before { display: none; }

        .channel-empty:hover {
            transform: none;
            border-color: #e3e8ec;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.07);
        }

        /* Bottom Control Bar: white platform with a curved top edge */
        .bottom-bar {
            height: 96px;
            background: linear-gradient(to bottom, #ffffff 0%, #eef2f5 100%);
            border-top: 2px solid var(--wii-edge);
            border-radius: 50% 50% 0 0 / 28px 28px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 60px 0;
            box-shadow: 0 -4px 14px rgba(80, 100, 120, 0.12);
        }

        .round-button {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ffffff 0%, #e6ebef 100%);
            border: 3px solid #c9d1d8;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), inset 0 -4px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: var(--wii-gray);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .round-button:hover {
            border-color: var(--wii-blue);
            color: var(--wii-blue);
            box-shadow: 0 0 16px var(--wii-blue-glow), 0 3px 8px rgba(0, 0, 0, 0.15);
            transform: scale(1.08);
        }

        .left-buttons {
            display: flex;
            gap: 16px;
        }

        .round-button.busy {
            opacity: 0.5;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #4a5258;
            border: 2px solid var(--wii-blue);
            padding: 10px 24px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 0 16px var(--wii-blue-glow);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }

        .center-time {
            text-align: center;
        }

        .time-display {
            font-size: 34px;
            font-weight: 300;
            color: #7b848c;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 13px;
            font-weight: 600;
            color: #a2aab1;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="system-title">Wii Menu</div>
        <div class="controller-status" id="controller-status">Xbox Pad: Press any button to activate</div>
    </div>

    <div class="grid-container">
        <div class="page-arrow left" id="prev-page" onclick="prevPage()">&lt;</div>
        
        <div class="wii-grid" id="channel-grid">
            <!-- 12 Channels dynamically rendered here -->
        </div>

        <div class="page-arrow right" id="next-page" onclick="nextPage()">&gt;</div>
    </div>

    <div class="bottom-bar">
        <div class="left-buttons">
            <div class="round-button" onclick="location.reload()" title="Refresh ROMs">Wii</div>
            <div class="round-button" id="import-button" onclick="importRoms()" title="Import ROM zips (Y)">Zip</div>
        </div>
        <div class="center-time">
            <div class="time-display" id="clock">12:00</div>
            <div class="date-display" id="date">Mon 10/19</div>
        </div>
        <div class="round-button" title="Message Board">&#9993;</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const CHANNELS_PER_PAGE = 12;
        let allGames = [];
        let currentPage = 0;
        let selectedIndex = 0; // Relative to current page (0-11)
        let activeGamepadIndex = null;
        let lastInputTime = 0;

        // Clock Update
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const day = days[now.getDay()];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            document.getElementById('date').innerText = `${day} ${month}/${date}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fetch Games from Server
        async function loadGames() {
            try {
                const res = await fetch('/api/games');
                allGames = await res.json();
                renderPage();
            } catch (err) {
                console.error("Failed to load games:", err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderPage() {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';

            const startIdx = currentPage * CHANNELS_PER_PAGE;
            const pageGames = allGames.slice(startIdx, startIdx + CHANNELS_PER_PAGE);

            for (let i = 0; i < CHANNELS_PER_PAGE; i++) {
                const game = pageGames[i];
                const channel = document.createElement('div');
                
                if (game) {
                    const badgeClass = `badge-${game.console}`;
                    channel.className = `wii-channel ${i === selectedIndex ? 'selected' : ''}`;
                    channel.innerHTML = `
                        <span class="channel-badge ${badgeClass}">${game.console}</span>
                        <div class="channel-title">${escapeHtml(game.title)}</div>
                        <div></div>
                    `;

                    // Mouse Events
                    channel.addEventListener('mouseenter', () => {
                        selectedIndex = i;
                        updateSelectionVisuals();
                    });

                    channel.addEventListener('click', () => {
                        launchGame(game);
                    });
                } else {
                    // Empty Wii Channel Slot
                    channel.className = 'wii-channel channel-empty';
                    channel.innerHTML = `<span class="channel-badge badge-empty"></span><div class="channel-title"></div>`;
                }
                
                grid.appendChild(channel);
            }
        }

        function updateSelectionVisuals() {
            const channels = document.querySelectorAll('.wii-channel:not(.channel-empty)');
            channels.forEach((ch, idx) => {
                if (idx === selectedIndex) {
                    ch.classList.add('selected');
                } else {
                    ch.classList.remove('selected');
                }
            });
        }

        function nextPage() {
            if ((currentPage + 1) * CHANNELS_PER_PAGE < allGames.length) {
                currentPage++;
                selectedIndex = 0;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                selectedIndex = 0;
                renderPage();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Unzip any archives dropped in roms/ and refresh the grid
        async function importRoms() {
            const btn = document.getElementById('import-button');
            if (btn.classList.contains('busy')) return;
            btn.classList.add('busy');
            showToast('Importing ROMs...');
            try {
                const res = await fetch('/api/process-roms');
                const { ok, output } = await res.json();
                await loadGames();
                const added = (output.match(/\[ROMS\] Added/g) || []).length;
                showToast(ok ? `Import complete: ${added} game(s) added` : 'Import finished with problems (see server log)');
            } catch (err) {
                showToast('Import failed');
            }
            btn.classList.remove('busy');
        }

        async function launchGame(game) {
            console.log(`Launching ${game.title}...`);
            await fetch(`/api/launch?console=${game.console}&path=${encodeURIComponent(game.fullPath)}`);
        }

        // ================= GAMEPAD ENGINE =================
        window.addEventListener("gamepadconnected", (e) => {
            activeGamepadIndex = e.gamepad.index;
            document.getElementById('controller-status').innerText = `Connected: ${e.gamepad.id.split('(')[0]}`;
            document.getElementById('controller-status').classList.add('connected');
        });

        window.addEventListener("gamepaddisconnected", () => {
            activeGamepadIndex = null;
            document.getElementById('controller-status').innerText = "Xbox Pad: Disconnected";
            document.getElementById('controller-status').classList.remove('connected');
        });

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;

            // Search dynamically for first active gamepad
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    gp = gamepads[i];
                    break;
                }
            }

            const now = Date.now();
            if (gp && now - lastInputTime > 180) { // 180ms debounce for responsive navigation
                const leftStickX = gp.axes[0] || 0;
                const leftStickY = gp.axes[1] || 0;
                const dpadUp = gp.buttons[12]?.pressed;
                const dpadDown = gp.buttons[13]?.pressed;
                const dpadLeft = gp.buttons[14]?.pressed;
                const dpadRight = gp.buttons[15]?.pressed;
                const buttonA = gp.buttons[0]?.pressed;
                const buttonY = gp.buttons[3]?.pressed;
                const bumperL = gp.buttons[4]?.pressed;
                const bumperR = gp.buttons[5]?.pressed;

                const startIdx = currentPage * CHANNELS_PER_PAGE;
                const pageGamesCount = Math.min(CHANNELS_PER_PAGE, allGames.length - startIdx);

                // Grid Navigation (4 Columns x 3 Rows)
                if (dpadRight || leftStickX > 0.5) {
                    if (selectedIndex + 1 < pageGamesCount) {
                        selectedIndex++;
                        updateSelectionVisuals();
                        lastInputTime = now;
                    } else if ((currentPage + 1) * CHANNELS_PER_PAGE < allGames.length) {
                        nextPage();
                        lastInputTime = now;
                    }
                } else if (dpadLeft || leftStickX < -0.5) {
                    if (selectedIndex > 0) {
                        selectedIndex--;
                        updateSelectionVisuals();
                        lastInputTime = now;
                    } else if (currentPage > 0) {
                        prevPage();
                        selectedIndex = CHANNELS_PER_PAGE - 1;
                        lastInputTime = now;
                    }
                } else if (dpadDown || leftStickY > 0.5) {
                    if (selectedIndex + 4 < pageGamesCount) {
                        selectedIndex += 4;
                        updateSelectionVisuals();
                        lastInputTime = now;
                    }
                } else if (dpadUp || leftStickY < -0.5) {
                    if (selectedIndex - 4 >= 0) {
                        selectedIndex -= 4;
                        updateSelectionVisuals();
                        lastInputTime = now;
                    }
                }

                // Bumpers for Page Flipping
                if (bumperR) { nextPage(); lastInputTime = now; }
                if (bumperL) { prevPage(); lastInputTime = now; }

                // Import ROM zips (Y Button)
                if (buttonY) { importRoms(); lastInputTime = now + 500; }

                // Launch (A Button)
                if (buttonA) {
                    const targetGame = allGames[startIdx + selectedIndex];
                    if (targetGame) {
                        launchGame(targetGame);
                        lastInputTime = now + 500; // longer debounce on launch
                    }
                }
            }

            requestAnimationFrame(pollGamepad);
        }

        // Start Loop & Load
        loadGames();
        requestAnimationFrame(pollGamepad);
    </script>
</body>
</html>
