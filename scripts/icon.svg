<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f5f8"/>
      <stop offset="1" stop-color="#d9e1e8"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc6fa"/>
      <stop offset="1" stop-color="#2182cf"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1b4f7a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" stroke="#bfe6fb" stroke-width="10"/>
  <g clip-path="url(#clip)">
    <ellipse cx="256" cy="-40" rx="330" ry="250" fill="url(#gloss)" opacity="0.8"/>
  </g>
  <g filter="url(#shadow)">
    <path fill="url(#pad)" d="M150 168 H362 C414 168 438 206 452 286 C464 352 456 384 422 384 C396 384 384 366 368 340 C360 328 350 322 336 322 H176 C162 322 152 328 144 340 C128 366 116 384 90 384 C56 384 48 352 60 286 C74 206 98 168 150 168 Z"/>
  </g>
  <path fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" d="M150 180 H362 C404 180 424 210 438 280"/>
  <!-- d-pad -->
  <path fill="#fff" d="M158 224 h22 v22 h22 v22 h-22 v22 h-22 v-22 h-22 v-22 h22 z"/>
  <!-- face buttons -->
  <circle cx="352" cy="256" r="17" fill="#fff"/>
  <circle cx="392" cy="226" r="17" fill="#fff"/>
  <circle cx="392" cy="286" r="17" fill="#fff" fill-opacity="0.9"/>
  <circle cx="432" cy="256" r="17" fill="#fff" fill-opacity="0.9"/>
  <!-- center pills -->
