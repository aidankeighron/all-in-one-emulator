<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Box UI</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .channel { width: 200px; height: 150px; background: #333; border: 4px solid transparent; display: flex; align-items: center; justify-content: center; border-radius: 12px; transition: transform 0.2s; }
        .channel.selected { border-color: #00ffcc; transform: scale(1.1); background: #444; }
    </style>
</head>
<body>
    <h1 id="console-title">Nintendo Wii Channels</h1>
    <div class="grid" id="game-grid">
        <!-- Games will be injected here via JS -->
    </div>
    <script src="app.js"></script>
</body>
</html>
